<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Naresh Personal OS</title>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 30px;
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  color: white;
  min-height: 100vh;
}

h1 {
  text-align: center;
  margin-bottom: 40px;
}

.container {
  max-width: 900px;
  margin: auto;
}

.main-btn {
  width: 100%;
  padding: 16px;
  margin-bottom: 20px;
  font-size: 16px;
  font-weight: bold;
  border: none;
  border-radius: 12px;
  background: white;
  color: #2a5298;
  cursor: pointer;
}

.section {
  display: none;
  background: white;
  color: black;
  padding: 25px;
  border-radius: 12px;
}

/* LEVEL 1 */
.level1 {
  background: #2a5298;
  color: white;
  padding: 12px 15px;
  border-radius: 8px;
  margin-top: 25px;
  font-size: 20px;
  font-weight: bold;
}

/* LEVEL 2 */
.level2 {
  background: #e4ecff;
  padding: 10px 12px;
  border-radius: 6px;
  margin-top: 15px;
  font-weight: bold;
}

/* LEVEL 3 */
.level3 {
  margin-top: 12px;
  font-weight: bold;
  color: #333;
}

ol {
  padding-left: 25px;
  margin-top: 10px;
}

li {
  margin-bottom: 8px;
}

.notes {
  font-size: 12px;
  color: gray;
}

summary {
  cursor: pointer;
}

.daily-item {
  margin-bottom: 10px;
  padding: 8px;
  border-left: 4px solid #2a5298;
  background: #f3f6ff;
  border-radius: 6px;
}
</style>
</head>

<body>

<h1>Naresh Personal OS</h1>

<div class="container">

<button class="main-btn" onclick="showSection('daily')">
Daily Tasks
</button>

<button class="main-btn" onclick="showSection('routine')">
Daily Routine
</button>

<div id="daily" class="section"></div>
<div id="routine" class="section"></div>

</div>

<script>

function showSection(id) {
  document.querySelectorAll(".section").forEach(sec => {
    sec.style.display = "none";
  });
  const selected = document.getElementById(id);
  if (selected) selected.style.display = "block";
}

window.onload = function() {

fetch("data/daily_routine.json")
.then(response => response.json())
.then(data => {

  const routineDiv = document.getElementById("routine");
  const dailyDiv = document.getElementById("daily");

  if (!routineDiv || !dailyDiv) return;

  routineDiv.innerHTML = "";
  dailyDiv.innerHTML = "";

  // Sort by order
  data.sort((a, b) => (a.order || 0) - (b.order || 0));

  // =============================
  // DAILY TASKS (urgent filter)
  // =============================

  const urgentItems = data.filter(item => item.urgent === true);

  if (urgentItems.length === 0) {
    dailyDiv.innerHTML = "<p>No urgent tasks.</p>";
  } else {
    urgentItems.forEach(item => {

      const container = document.createElement("div");
      container.className = "daily-item";

      if (item.link) {
        const a = document.createElement("a");
        a.href = item.link;
        a.target = "_blank";
        a.textContent = item.item_name;
        container.appendChild(a);
      } else {
        container.textContent = item.item_name;
      }

      dailyDiv.appendChild(container);
    });
  }

  // =============================
  // ROUTINE (structured roadmap)
  // =============================

  const grouped = {};

  data.forEach(item => {

    const l1 = item.level1 || "Other";
    const l2 = item.level2 || "Misc";
    const l3 = item.level3 || "General";

    if (!grouped[l1]) grouped[l1] = {};
    if (!grouped[l1][l2]) grouped[l1][l2] = {};
    if (!grouped[l1][l2][l3]) grouped[l1][l2][l3] = [];

    grouped[l1][l2][l3].push(item);
  });

  for (const level1 in grouped) {

    const d1 = document.createElement("details");
    const s1 = document.createElement("summary");
    s1.className = "level1";
    s1.textContent = level1;
    d1.appendChild(s1);

    for (const level2 in grouped[level1]) {

      const d2 = document.createElement("details");
      const s2 = document.createElement("summary");
      s2.className = "level2";
      s2.textContent = level2;
      d2.appendChild(s2);

      for (const level3 in grouped[level1][level2]) {

        const d3 = document.createElement("details");
        const s3 = document.createElement("summary");
        s3.className = "level3";
        s3.textContent = level3;
        d3.appendChild(s3);

        const list = document.createElement("ol");

        grouped[level1][level2][level3].forEach(item => {

          const li = document.createElement("li");

          if (item.link) {
            const a = document.createElement("a");
            a.href = item.link;
            a.target = "_blank";
            a.textContent = item.item_name;
            li.appendChild(a);
          } else {
            li.textContent = item.item_name;
          }

          if (item.notes) {
            const note = document.createElement("div");
            note.className = "notes";
            note.textContent = "Notes: " + item.notes;
            li.appendChild(note);
          }

          list.appendChild(li);
        });

        d3.appendChild(list);
        d2.appendChild(d3);
      }

      d1.appendChild(d2);
    }

    routineDiv.appendChild(d1);
  }

})
.catch(error => console.error("JSON error:", error));

};

</script>

</body>
</html>
