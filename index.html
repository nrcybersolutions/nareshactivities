<script>

document.addEventListener("DOMContentLoaded", function() {

  fetch("data/daily_routine.json")
    .then(res => res.json())
    .then(data => {

      const routineDiv = document.getElementById("routine");
      if (!routineDiv) return;

      routineDiv.innerHTML = ""; // clear before render

      // 🔹 Filter Active only
      const activeItems = data.filter(item => 
        item.Status === "Active" || item.status === "Active"
      );

      // 🔹 Sort by order number
      activeItems.sort((a, b) => (a.order || 0) - (b.order || 0));

      const grouped = {};

      activeItems.forEach(item => {

        const l1 = item.level1 || "Other";
        const l2 = item.level2 || "Misc";
        const l3 = item.level3 || "General";

        if (!grouped[l1]) grouped[l1] = {};
        if (!grouped[l1][l2]) grouped[l1][l2] = {};
        if (!grouped[l1][l2][l3]) grouped[l1][l2][l3] = [];

        grouped[l1][l2][l3].push(item);
      });

      for (const level1 in grouped) {

        const h2 = document.createElement("h2");
        h2.textContent = level1;
        routineDiv.appendChild(h2);

        for (const level2 in grouped[level1]) {

          const h3 = document.createElement("h3");
          h3.textContent = level2;
          routineDiv.appendChild(h3);

          for (const level3 in grouped[level1][level2]) {

            const h4 = document.createElement("h4");
            h4.textContent = level3;
            routineDiv.appendChild(h4);

            grouped[level1][level2][level3].forEach(item => {

              const p = document.createElement("p");

              if (item.link) {
                const a = document.createElement("a");
                a.href = item.link;
                a.target = "_blank";
                a.textContent = item.item_name;
                p.appendChild(a);
              } else {
                p.textContent = item.item_name;
              }

              // 🔹 Show notes if exists
              if (item.notes) {
                const note = document.createElement("div");
                note.style.fontSize = "12px";
                note.style.color = "gray";
                note.textContent = item.notes;
                p.appendChild(note);
              }

              routineDiv.appendChild(p);
            });

          }
        }
      }

    })
    .catch(err => console.error("Fetch error:", err));

});

</script>
