<!DOCTYPE html>
<html>
<head>
  <title>Naresh Personal OS</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f6f8;
    }

    h1 {
      text-align: center;
    }

    .main-btn {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
      cursor: pointer;
    }

    .main-btn:hover {
      opacity: 0.9;
    }
  </style>

</head>
<body>

  <h1>Naresh Personal OS</h1>

  <button class="main-btn">Daily Tasks</button>
  <button class="main-btn">Daily Routine</button>
  <button class="main-btn">Physical Activities</button>

</body>
</html>
