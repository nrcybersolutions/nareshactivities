<!DOCTYPE html>
<html>
<head>
  <title>Naresh Personal OS</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f6f8;
    }

    h1 {
      text-align: center;
    }

    .main-btn {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
      cursor: pointer;
    }

    .section {
      display: none;
      background: white;
      padding: 15px;
      margin-top: 5px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1>Naresh Personal OS</h1>

  <button class="main-btn" onclick="toggleSection('tasks')">
    Daily Tasks
  </button>
  <div id="tasks" class="section">
    Daily Tasks Content Coming Soon
  </div>

  <button class="main-btn" onclick="toggleSection('routine')">
    Daily Routine
  </button>
  <div id="routine" class="section">
    Daily Routine Content Coming Soon
  </div>

  <button class="main-btn" onclick="toggleSection('physical')">
    Physical Activities
  </button>
  <div id="physical" class="section">
    Physical Activities Content Coming Soon
  </div>

  <script>
    function toggleSection(id) {
      const sections = document.querySelectorAll('.section');
      sections.forEach(sec => sec.style.display = "none");

      const selected = document.getElementById(id);
      selected.style.display = "block";
    }
  </script>

</body>
</html>
