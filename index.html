<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Naresh Personal OS</title>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 30px;
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  color: white;
  min-height: 100vh;
}

h1 {
  text-align: center;
  margin-bottom: 40px;
}

.container {
  max-width: 900px;
  margin: auto;
}

.main-btn {
  width: 100%;
  padding: 16px;
  margin-bottom: 20px;
  font-size: 16px;
  font-weight: bold;
  border: none;
  border-radius: 12px;
  background: white;
  color: #2a5298;
  cursor: pointer;
}

.section {
  display: none;
  background: white;
  color: black;
  padding: 25px;
  border-radius: 12px;
}

/* LEVEL STYLES */
.level1 {
  background: #2a5298;
  color: white;
  padding: 12px 15px;
  border-radius: 8px;
  margin-top: 25px;
  font-size: 20px;
  font-weight: bold;
}

.level2 {
  background: #e4ecff;
  padding: 10px 12px;
  border-radius: 6px;
  margin-top: 15px;
  font-weight: bold;
}

.level3 {
  margin-top: 12px;
  font-weight: bold;
  color: #333;
}

ol {
  padding-left: 25px;
  margin-top: 10px;
}

li {
  margin-bottom: 8px;
}

.notes {
  font-size: 12px;
  color: gray;
}

/* Link Button */
.link-btn {
  margin-left: 10px;
  padding: 3px 8px;
  font-size: 11px;
  border-radius: 6px;
  border: none;
  background: #2a5298;
  color: white;
  cursor: pointer;
}

.link-btn:hover {
  background: #1e3c72;
}

summary {
  cursor: pointer;
}
</style>
</head>

<body>

<h1>Naresh Personal OS</h1>

<div class="container">

<button class="main-btn" onclick="toggleSection('daily')">
Daily Tasks
</button>

<button class="main-btn" onclick="toggleSection('routine')">
Daily Routine
</button>

<div id="daily" class="section"></div>
<div id="routine" class="section"></div>

</div>

<script>

function toggleSection(id) {
  const selected = document.getElementById(id);

  if (selected.style.display === "block") {
    selected.style.display = "none";
    return;
  }

  document.querySelectorAll(".section").forEach(sec => {
    sec.style.display = "none";
  });

  selected.style.display = "block";
}

window.onload = function() {

fetch("data/daily_routine.json")
.then(response => response.json())
.then(data => {

  const routineDiv = document.getElementById("routine");
  const dailyDiv = document.getElementById("daily");

  if (!routineDiv || !dailyDiv) return;

  routineDiv.innerHTML = "";
  dailyDiv.innerHTML = "";

  data.sort((a, b) => (a.order || 0) - (b.order || 0));

  // ======================
  // DAILY TASKS (3 COLUMN)
  // ======================

  const urgentItems = data.filter(item => item.urgent === true);
  const groupedUrgent = {};

  urgentItems.forEach(item => {
    const category = item.level1 || "Other";

    if (!groupedUrgent[category]) {
      groupedUrgent[category] = [];
    }

    groupedUrgent[category].push(item);
  });

  const grid = document.createElement("div");
  grid.style.display = "grid";
  grid.style.gridTemplateColumns = "repeat(auto-fit, minmax(250px, 1fr))";
  grid.style.gap = "20px";

  for (const category in groupedUrgent) {

    const column = document.createElement("div");

    const header = document.createElement("div");
    header.style.fontWeight = "bold";
    header.style.marginBottom = "10px";
    header.style.color = "#2a5298";
    header.textContent = category;

    column.appendChild(header);

    groupedUrgent[category].forEach(item => {

      const task = document.createElement("div");
      task.style.display = "flex";
      task.style.alignItems = "center";
      task.style.justifyContent = "space-between";
      task.style.marginBottom = "8px";

      const left = document.createElement("div");
      left.style.display = "flex";
      left.style.alignItems = "center";

      const icon = document.createElement("span");
      icon.style.width = "10px";
      icon.style.height = "10px";
      icon.style.borderRadius = "50%";
      icon.style.marginRight = "8px";

      if (item.priority === "high") {
        icon.style.backgroundColor = "red";
      } else if (item.priority === "medium") {
        icon.style.backgroundColor = "#2a5298";
      } else {
        icon.style.backgroundColor = "gray";
      }

      const text = document.createElement("span");
      text.textContent = item.item_name;

      left.appendChild(icon);
      left.appendChild(text);
      task.appendChild(left);

      if (item.link && item.link.trim() !== "") {
        const btn = document.createElement("button");
        btn.className = "link-btn";
        btn.textContent = "Open";
        btn.onclick = () => window.open(item.link, "_blank");
        task.appendChild(btn);
      }

      column.appendChild(task);
    });

    grid.appendChild(column);
  }

  dailyDiv.appendChild(grid);

  // ======================
  // ROUTINE STRUCTURE
  // ======================

  const grouped = {};

  data.forEach(item => {

    const l1 = item.level1 || "Other";
    const l2 = item.level2 || "Misc";
    const l3 = item.level3 || "General";

    if (!grouped[l1]) grouped[l1] = {};
    if (!grouped[l1][l2]) grouped[l1][l2] = {};
    if (!grouped[l1][l2][l3]) grouped[l1][l2][l3] = [];

    grouped[l1][l2][l3].push(item);
  });

  for (const level1 in grouped) {

    const d1 = document.createElement("details");
    const s1 = document.createElement("summary");
    s1.className = "level1";
    s1.textContent = level1;
    d1.appendChild(s1);

    for (const level2 in grouped[level1]) {

      const d2 = document.createElement("details");
      const s2 = document.createElement("summary");
      s2.className = "level2";
      s2.textContent = level2;
      d2.appendChild(s2);

      for (const level3 in grouped[level1][level2]) {

        const d3 = document.createElement("details");
        const s3 = document.createElement("summary");
        s3.className = "level3";
        s3.textContent = level3;
        d3.appendChild(s3);

        const list = document.createElement("ol");

        grouped[level1][level2][level3].forEach(item => {

          const li = document.createElement("li");

          const row = document.createElement("div");
          row.style.display = "flex";
          row.style.justifyContent = "space-between";
          row.style.alignItems = "center";

          const name = document.createElement("span");
          name.textContent = item.item_name;

          row.appendChild(name);

          if (item.link && item.link.trim() !== "") {
            const btn = document.createElement("button");
            btn.className = "link-btn";
            btn.textContent = "Open";
            btn.onclick = () => window.open(item.link, "_blank");
            row.appendChild(btn);
          }

          li.appendChild(row);

          if (item.notes) {
            const note = document.createElement("div");
            note.className = "notes";
            note.textContent = "Notes: " + item.notes;
            li.appendChild(note);
          }

          list.appendChild(li);
        });

        d3.appendChild(list);
        d2.appendChild(d3);
      }

      d1.appendChild(d2);
    }

    routineDiv.appendChild(d1);
  }

})
.catch(error => console.error("JSON error:", error));

};

</script>

</body>
</html>
