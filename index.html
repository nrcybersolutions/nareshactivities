<!DOCTYPE html>
<html>
<head>
  <title>Naresh Personal OS</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 28px;
    }

    .container {
      max-width: 400px;
      margin: auto;
    }

    .main-btn {
      width: 100%;
      padding: 16px;
      margin-bottom: 15px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: white;
      color: #2a5298;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      transition: transform 0.1s ease;
    }

    .main-btn:hover {
      transform: scale(1.03);
    }

    .section {
      display: none;
      background: white;
      color: #333;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <h1>Naresh Personal OS</h1>

  <div class="container">

    <button class="main-btn" onclick="toggleSection('tasks')">
      Daily Tasks
    </button>
    <div id="tasks" class="section">
      Daily Tasks Coming Soon
    </div>

    <button class="main-btn" onclick="toggleSection('routine')">
      Daily Routine
    </button>
    <div id="routine" class="section">
      Daily Routine Coming Soon
    </div>

    <button class="main-btn" onclick="toggleSection('physical')">
      Physical Activities
    </button>
    <div id="physical" class="section">
      Physical Activities Coming Soon
    </div>

  </div>

  <script>
    function toggleSection(id) {
      const sections = document.querySelectorAll('.section');
      sections.forEach(sec => sec.style.display = "none");

      const selected = document.getElementById(id);
      selected.style.display = "block";
    }
  </script>

</body>
</html>
