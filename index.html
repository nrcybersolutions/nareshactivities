<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Naresh Personal OS</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .main-btn {
      width: 100%;
      padding: 16px;
      margin-bottom: 15px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: white;
      color: #2a5298;
      cursor: pointer;
    }

    .section {
      display: none;
      background: white;
      color: black;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    h2, h3, h4 {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>Naresh Personal OS</h1>

  <div class="container">

    <button class="main-btn" onclick="showSection('routine')">
      Daily Routine
    </button>

    <div id="routine" class="section"></div>

  </div>

<script>

function showSection(id) {
  document.querySelectorAll(".section").forEach(sec => {
    sec.style.display = "none";
  });
  const selected = document.getElementById(id);
  if (selected) selected.style.display = "block";
}

window.onload = function() {

  fetch("data/daily_routine.json")
    .then(response => response.json())
    .then(data => {

      const routineDiv = document.getElementById("routine");
      if (!routineDiv) return;

      routineDiv.innerHTML = "";

      const grouped = {};

      data.forEach(item => {

        const l1 = item.level1 || "Other";
        const l2 = item.level2 || "Misc";
        const l3 = item.level3 || "General";

        if (!grouped[l1]) grouped[l1] = {};
        if (!grouped[l1][l2]) grouped[l1][l2] = {};
        if (!grouped[l1][l2][l3]) grouped[l1][l2][l3] = [];

        grouped[l1][l2][l3].push(item);
      });

      for (const level1 in grouped) {

        const d1 = document.createElement("details");
        const s1 = document.createElement("summary");
        s1.textContent = level1;
        d1.appendChild(s1);

        for (const level2 in grouped[level1]) {

          const d2 = document.createElement("details");
          const s2 = document.createElement("summary");
          s2.textContent = level2;
          d2.appendChild(s2);

          for (const level3 in grouped[level1][level2]) {

            const d3 = document.createElement("details");
            const s3 = document.createElement("summary");
            s3.textContent = level3;
            d3.appendChild(s3);

            grouped[level1][level2][level3].forEach(item => {

              const container = document.createElement("div");
              container.style.padding = "8px 0 8px 15px";

              const title = document.createElement("div");
              title.style.fontWeight = "bold";

              if (item.link) {
                const a = document.createElement("a");
                a.href = item.link;
                a.target = "_blank";
                a.textContent = item.item_name;
                title.appendChild(a);
              } else {
                title.textContent = item.item_name;
              }

              container.appendChild(title);

              if (item.type) {
                const type = document.createElement("div");
                type.style.fontSize = "12px";
                type.textContent = "Type: " + item.type;
                container.appendChild(type);
              }

              if (item.notes) {
                const notes = document.createElement("div");
                notes.style.fontSize = "12px";
                notes.style.color = "gray";
                notes.textContent = "Notes: " + item.notes;
                container.appendChild(notes);
              }

              d3.appendChild(container);

            });

            d2.appendChild(d3);
          }

          d1.appendChild(d2);
        }

        routineDiv.appendChild(d1);
      }

    })
    .catch(error => console.error("JSON error:", error));
};

</script>

</body>
</html>
