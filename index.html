<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Naresh Personal OS</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .main-btn {
      width: 100%;
      padding: 16px;
      margin-bottom: 15px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: white;
      color: #2a5298;
      cursor: pointer;
    }

    .section {
      display: none;
      background: white;
      color: black;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .level1-btn, .level2-btn {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #e6e6e6;
      cursor: pointer;
      text-align: left;
      font-weight: bold;
    }

    .level2-btn {
      margin-left: 10px;
      background: #f2f2f2;
      font-weight: normal;
    }

    .item-link {
      margin-left: 25px;
      display: block;
      padding: 4px 0;
    }
  </style>
</head>

<body>

  <h1>Naresh Personal OS</h1>

  <div class="container">

    <button class="main-btn" onclick="showSection('routine')">
      Daily Routine
    </button>

    <div id="routine" class="section"></div>

  </div>

  <script>

    function showSection(id) {
      const sections = document.querySelectorAll('.section');
      sections.forEach(sec => sec.style.display = "none");

      const selected = document.getElementById(id);
      if (selected) selected.style.display = "block";
    }

    window.onload = function() {

      fetch("data/daily_routine.json")
        .then(res => res.json())
        .then(data => {

          const routineDiv = document.getElementById("routine");
          if (!routineDiv) return;

          const grouped = {};

          data.forEach(item => {
            const l1 = item.level1 || "Other";
            const l2 = item.level2 || "Misc";

            if (!grouped[l1]) grouped[l1] = {};
            if (!grouped[l1][l2]) grouped[l1][l2] = [];

            grouped[l1][l2].push(item);
          });

          for (const level1 in grouped) {

            // LEVEL 1 BUTTON
            const level1Btn = document.createElement("button");
            level1Btn.textContent = "▶ " + level1;
            level1Btn.className = "level1-btn";

            const level1Container = document.createElement("div");
            level1Container.style.display = "none";

            level1Btn.onclick = function() {
              const isHidden = level1Container.style.display === "none";
              level1Container.style.display = isHidden ? "block" : "none";
              level1Btn.textContent = (isHidden ? "▼ " : "▶ ") + level1;
            };

            routineDiv.appendChild(level1Btn);
            routineDiv.appendChild(level1Container);

            for (const level2 in grouped[level1]) {

              // LEVEL 2 BUTTON
              const level2Btn = document.createElement("button");
              level2Btn.textContent = "▶ " + level2;
              level2Btn.className = "level2-btn";

              const level2Container = document.createElement("div");
              level2Container.style.display = "none";

              level2Btn.onclick = function() {
                const isHidden = level2Container.style.display === "none";
                level2Container.style.display = isHidden ? "block" : "none";
                level2Btn.textContent = (isHidden ? "▼ " : "▶ ") + level2;
              };

              level1Container.appendChild(level2Btn);
              level1Container.appendChild(level2Container);

              grouped[level1][level2].forEach(item => {

                const link = document.createElement("a");
                link.href = item.link || "#";
                link.target = "_blank";
                link.textContent = item.item_name;
                link.className = "item-link";

                level2Container.appendChild(link);
              });
            }
          }

        })
        .catch(err => console.error(err));
    };

  </script>

</body>
</html>
